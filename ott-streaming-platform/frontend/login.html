<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>OTT Streaming Platform</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="css/variables.css">

<link rel="stylesheet"
href="css/common.css">

<link rel="stylesheet"
href="css/auth.css">

</head>

<body>

<div class="overlay">

<div class="login-card">

<div class="logo">

<h1>OTT STREAM</h1>

<p>Unlimited Movies & Music</p>

</div>

<form id="loginForm">

<div class="input-group">

<label>Email</label>

<input
type="email"
id="email"
placeholder="Enter your email"
required>

</div>

<div class="input-group">

<label>Password</label>

<div class="password-box">

<input
type="password"
id="password"
placeholder="Enter password"
required>

<button
type="button"
id="togglePassword">

👁

</button>

</div>

</div>

<button
class="primary-btn login-btn"
type="submit">

Login

</button>

<p id="errorMessage"></p>

</form>

<div class="footer-text">

Don't have an account?

<a href="signup.html">

Signup

</a>

</div>

</div>

</div>

<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>

</body>

</html>
